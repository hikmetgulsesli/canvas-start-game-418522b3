<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-emerald-500 selection:text-white">
  <div data-surface-id="SURF_PLAY_PAGE" class="flex-1 flex flex-col justify-between p-6 max-w-7xl mx-auto w-full" data-setfarm-element-ref="E000001">
    <!-- Top Header Bar -->
    <header class="flex items-center justify-between border-b border-slate-800 pb-5">
      <div class="flex items-center space-x-3">
        <div class="h-3 w-3 rounded-full bg-emerald-500 shadow-[0_0_10px_#10b981]"></div>
        <span class="text-lg font-bold tracking-wider uppercase text-slate-200">Canvas Arena</span>
        <span class="text-xs px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-400 font-mono">STANDALONE</span>
      </div>

      <div class="flex items-center space-x-6">
        <div class="text-right">
          <div class="text-xs text-slate-500 font-mono tracking-wider">RECORD VAULT</div>
          <div class="flex items-baseline space-x-2">
            <span class="text-xs text-slate-400">High Score:</span>
            <div data-surface-id="SURF_HIGH_SCORE_DISPLAY" class="inline-block" data-setfarm-element-ref="E000002">
              <span class="font-mono text-xl font-bold text-emerald-400">0</span>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Game Area -->
    <main class="my-8 flex-1 flex flex-col items-center justify-center">
      <div class="w-full max-w-4xl bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl relative overflow-hidden flex flex-col items-center">
        <!-- Visual Game Viewport Container -->
        <div data-surface-id="SURF_GAME_CANVAS" class="w-full h-96 bg-slate-950 rounded-xl border border-slate-800 relative flex flex-col items-center justify-center overflow-hidden" data-setfarm-element-ref="E000003">
          <div class="absolute inset-0 opacity-15 bg-[radial-gradient(#38bdf8_1px,transparent_1px)] [background-size:24px_24px]"></div>
          
          <div class="relative z-10 flex flex-col items-center text-center px-4">
            <div class="h-16 w-16 mb-4 rounded-2xl bg-emerald-950/60 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
              <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <polygon points="5 3 19 12 5 21 5 3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></polygon>
              </svg>
            </div>
            <h2 class="text-2xl font-bold text-white tracking-tight">Arena Grid Standby</h2>
            <p class="text-slate-400 text-sm max-w-md mt-2">Initialize the rendering loop and physics worker to begin interactive play session.</p>
          </div>
        </div>

        <!-- Action Control Slot -->
        <div class="mt-6 flex flex-col items-center">
          <button type="button" data-action="ACT_START_GAME" data-control-slot="CSLOT_START_GAME_START_BUTTON" class="px-8 py-3.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl shadow-[0_0_20px_rgba(16,185,129,0.35)] transition duration-150 uppercase tracking-wider text-sm flex items-center space-x-2 cursor-pointer" data-setfarm-element-ref="E000004">
            <span>Start</span>
          </button>
        </div>
      </div>
    </main>

    <!-- Bottom Status Panel -->
    <footer class="border-t border-slate-800 pt-4 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-500 font-mono gap-3">
      <div class="flex items-center space-x-3">
        <span class="text-slate-600">SESSION TELEMETRY:</span>
        <div data-surface-id="SURF_GAME_STATUS" class="px-3 py-1 bg-slate-900 border border-slate-800 rounded-md text-emerald-400 font-medium" data-setfarm-element-ref="E000005">
          Game started
        </div>
      </div>

      <div class="flex items-center space-x-4">
        <span>Route: /play</span>
        <span class="text-slate-700">|</span>
        <span>Tick: 60fps</span>
      </div>
    </footer>
  </div>

</body></html>
